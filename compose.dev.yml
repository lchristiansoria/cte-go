services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${USR_DB:-ctg_go}
      POSTGRES_PASSWORD: ${PASS_DB:-ctg_go_local}
      POSTGRES_DB: ${NAME_DB:-cte_go}
    ports:
      - "${PORT_DB:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ENV_APP: local
      HOST_DB: postgres
      PORT_DB: 5432
      NAME_DB: ${NAME_DB:-cte_go}
      USR_DB: ${USR_DB:-ctg_go}
      PASS_DB: ${PASS_DB:-ctg_go_local}
      TOKEN_AI: ${TOKEN_AI:-}
      URL_AI: ${URL_AI:-https://api.openai.com/v1}
      MODEL_AI: ${MODEL_AI:-gpt-4o-mini}
    ports:
      - "${PORT_API:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${PORT_FRONTEND:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  frontend_node_modules:
