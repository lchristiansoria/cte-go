services:
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - api
      - frontend
    ports:
      - "${PORT_HTTP:-80}:80"
      - "${PORT_HTTPS:-443}:443"

  frontend:
    image: cte-go-frontend:latest
    restart: unless-stopped
    environment:
      URL_API: ${URL_API:-http://api:8000}

  api:
    image: cte-go-backend:latest
    restart: unless-stopped
    depends_on:
      - postgres
      - rabbitmq
    expose:
      - "8000"
    environment:
      ENV_APP: ${ENV_APP:-production}
      HOST_DB: ${HOST_DB:-postgres}
      PORT_DB: ${PORT_DB:-5432}
      NAME_DB: ${NAME_DB:-cte_go}
      USR_DB: ${USR_DB}
      PASS_DB: ${PASS_DB}
      HOST_RABBIT: ${HOST_RABBIT:-rabbitmq}
      PORT_RABBIT: ${PORT_RABBIT:-5672}
      VHOST_RABBIT: ${VHOST_RABBIT:-/}
      USR_RABBIT: ${USR_RABBIT}
      PASS_RABBIT: ${PASS_RABBIT}
      TOKEN_APP: ${TOKEN_APP}
      SECRET_APP: ${SECRET_APP}
      URL_IA: ${URL_IA}
      MODEL_IA: ${MODEL_IA}
      TOKEN_IA: ${TOKEN_IA}
      URL_ARCA_WSAA: ${URL_ARCA_WSAA}
      URL_ARCA_WS: ${URL_ARCA_WS}
      USR_ARCA: ${USR_ARCA}
      PASS_ARCA: ${PASS_ARCA}
      TOKEN_ARCA: ${TOKEN_ARCA}
      CUIT_ARCA: ${CUIT_ARCA}
      CERT_ARCA_BASE64: ${CERT_ARCA_BASE64}
      KEY_ARCA_BASE64: ${KEY_ARCA_BASE64}
      URL_SISA: ${URL_SISA}
      CRON_SISA: ${CRON_SISA:-*/30 * * * *}
      TIMEOUT_SISA: ${TIMEOUT_SISA:-30}
      TOKEN_PROXY_SISA: ${TOKEN_PROXY_SISA}

  worker:
    image: cte-go-backend:latest
    restart: unless-stopped
    command: celery -A ctg_go worker -l info
    depends_on:
      - postgres
      - rabbitmq
    environment:
      ENV_APP: ${ENV_APP:-production}
      HOST_DB: ${HOST_DB:-postgres}
      PORT_DB: ${PORT_DB:-5432}
      NAME_DB: ${NAME_DB:-cte_go}
      USR_DB: ${USR_DB}
      PASS_DB: ${PASS_DB}
      HOST_RABBIT: ${HOST_RABBIT:-rabbitmq}
      PORT_RABBIT: ${PORT_RABBIT:-5672}
      VHOST_RABBIT: ${VHOST_RABBIT:-/}
      USR_RABBIT: ${USR_RABBIT}
      PASS_RABBIT: ${PASS_RABBIT}
      URL_SISA: ${URL_SISA}
      CRON_SISA: ${CRON_SISA:-*/30 * * * *}
      TIMEOUT_SISA: ${TIMEOUT_SISA:-30}
      TOKEN_PROXY_SISA: ${TOKEN_PROXY_SISA}

  scheduler:
    image: cte-go-backend:latest
    restart: unless-stopped
    command: celery -A ctg_go beat -l info
    depends_on:
      - postgres
      - rabbitmq
    environment:
      ENV_APP: ${ENV_APP:-production}
      HOST_DB: ${HOST_DB:-postgres}
      PORT_DB: ${PORT_DB:-5432}
      NAME_DB: ${NAME_DB:-cte_go}
      USR_DB: ${USR_DB}
      PASS_DB: ${PASS_DB}
      HOST_RABBIT: ${HOST_RABBIT:-rabbitmq}
      PORT_RABBIT: ${PORT_RABBIT:-5672}
      VHOST_RABBIT: ${VHOST_RABBIT:-/}
      USR_RABBIT: ${USR_RABBIT}
      PASS_RABBIT: ${PASS_RABBIT}
      URL_SISA: ${URL_SISA}
      CRON_SISA: ${CRON_SISA:-*/30 * * * *}
      TIMEOUT_SISA: ${TIMEOUT_SISA:-30}
      TOKEN_PROXY_SISA: ${TOKEN_PROXY_SISA}

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${USR_DB}
      POSTGRES_PASSWORD: ${PASS_DB}
      POSTGRES_DB: ${NAME_DB:-cte_go}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    expose:
      - "5672"
    environment:
      RABBITMQ_DEFAULT_USER: ${USR_RABBIT}
      RABBITMQ_DEFAULT_PASS: ${PASS_RABBIT}
      RABBITMQ_DEFAULT_VHOST: ${VHOST_RABBIT:-/}

volumes:
  postgres_data:
