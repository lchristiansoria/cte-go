[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctg-go-backend"
version = "0.1.0"
description = "CTG GO backend base for persistence layer"
requires-python = ">=3.11"
dependencies = [
  "SQLAlchemy>=2.0.35,<2.1.0",
  "alembic>=1.13.2,<2.0.0",
  "psycopg[binary]>=3.2.1,<4.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2,<9.0.0",
]

[project.scripts]
ctg-go-seed = "ctg_go.seed.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["migrations/tests"]
